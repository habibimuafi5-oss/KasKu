<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B5D56">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="KasKu">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>KasKu – Catatan Kas UMKM</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
:root{--bg:#F3F6F5;--card:#fff;--tx:#0F1F1C;--mut:#64766F;--line:#E3EAE7;--pri:#0B5D56;--pri2:#0E7C72;--in:#12803F;--inbg:#E4F5EA;--out:#C8223F;--outbg:#FCE9ED;--chip:#EAF0EE;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0C1513;--card:#142220;--tx:#E8F1EE;--mut:#8DA39C;--line:#233633;--in:#4ADE80;--inbg:#12301F;--out:#FB7185;--outbg:#3A1820;--chip:#1C2E2B}}
:root[data-theme="dark"]{--bg:#0C1513;--card:#142220;--tx:#E8F1EE;--mut:#8DA39C;--line:#233633;--in:#4ADE80;--inbg:#12301F;--out:#FB7185;--outbg:#3A1820;--chip:#1C2E2B}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.45}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--pri2);outline-offset:2px}
.app{max-width:480px;margin:0 auto;padding:16px 16px 110px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.logo{width:38px;height:38px;border-radius:12px;background:var(--pri);display:grid;place-items:center;color:#fff;font-weight:800;font-size:19px}
.top h1{margin:0;font-size:20px;font-weight:800;letter-spacing:-.3px}
.top p{margin:0;color:var(--mut);font-size:12.5px}
.hero{background:var(--pri);color:#fff;border-radius:22px;padding:20px}
.hero small{opacity:.8;font-size:13px}
.hero .big{font-size:32px;font-weight:800;letter-spacing:-.8px;margin:2px 0 14px}
.split{height:8px;border-radius:8px;background:rgba(255,255,255,.22);overflow:hidden;display:flex;margin-bottom:14px}
.split i{display:block;background:#7DF0B0;height:100%;transition:width .4s}
.hero .row{display:flex;gap:10px}
.hero .row div{flex:1;background:rgba(255,255,255,.12);border-radius:14px;padding:10px 12px}
.hero .row b{display:block;font-size:15px}
.hero .row span{font-size:12px;opacity:.85}
h2{font-size:16px;margin:22px 0 10px;font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:4px 14px}
.item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.ic{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:20px;flex:none}
.ic.in{background:var(--inbg)}.ic.out{background:var(--outbg)}
.item .m{flex:1;min-width:0}
.item .m b{display:block;font-weight:600;font-size:14.5px}
.item .m span{color:var(--mut);font-size:12.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt{font-weight:700;font-size:14.5px;white-space:nowrap}
.amt.in{color:var(--in)}.amt.out{color:var(--out)}
.del{width:30px;height:30px;border-radius:10px;color:var(--mut);font-size:16px;flex:none}
.del.arm{background:var(--outbg);color:var(--out);width:auto;padding:0 10px;font-size:12px;font-weight:700}
.empty{text-align:center;padding:28px 10px;color:var(--mut)}
.empty .e{font-size:34px}
.empty b{display:block;color:var(--tx);margin:6px 0 2px}
.link{color:var(--pri2);font-weight:700;margin-top:10px;padding:8px}
.chips{display:flex;gap:8px;margin:12px 0}
.chip{padding:8px 14px;border-radius:999px;background:var(--chip);font-weight:600;font-size:13.5px;color:var(--mut)}
.chip.on{background:var(--pri);color:#fff}
.mon{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px}
.mon button{width:40px;height:40px;border-radius:12px;font-size:18px}
.mon b{font-weight:700}
.day{color:var(--mut);font-size:12.5px;font-weight:600;margin:16px 4px 6px}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.sum div{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}
.sum span{color:var(--mut);font-size:12.5px}.sum b{display:block;font-size:16px;margin-top:2px}
.sum .w{grid-column:1/3}
.bar{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.bar:last-child{border-bottom:0}
.bar .t{flex:1;min-width:0}
.bar .t div{display:flex;justify-content:space-between;font-size:13.5px;font-weight:600;margin-bottom:6px}
.bar .t div em{font-style:normal;color:var(--mut);font-weight:500}
.track{height:7px;background:var(--chip);border-radius:7px;overflow:hidden}
.track i{display:block;height:100%;border-radius:7px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
nav div{max-width:480px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 64px 1fr 1fr;align-items:center;gap:4px}
nav .tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:12px;font-size:11.5px;font-weight:600;color:var(--mut)}
nav .tab span{font-size:20px;filter:grayscale(1);opacity:.7}
nav .tab.on{color:var(--pri2)}nav .tab.on span{filter:none;opacity:1}
.fab{width:56px;height:56px;border-radius:50%;background:var(--pri);color:#fff;font-size:30px;line-height:1;margin:-26px auto 0;box-shadow:0 6px 16px rgba(11,93,86,.4);display:grid;place-items:center}
.ov{position:fixed;inset:0;background:rgba(5,15,13,.5);z-index:10;display:none}
.ov.show{display:block}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;background:var(--card);border-radius:24px 24px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));max-height:92%;overflow-y:auto;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.split i{transition:none}}
.sheet h3{margin:0 0 12px;font-size:18px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--chip);border-radius:14px;padding:4px;margin-bottom:14px}
.seg button{padding:10px;border-radius:11px;font-weight:700;color:var(--mut)}
.seg button.on.in{background:var(--in);color:#fff}.seg button.on.out{background:var(--out);color:#fff}
@media (prefers-color-scheme:dark){.seg button.on.in,.seg button.on.out{color:#0C1513}}
label{display:block;font-size:12.5px;font-weight:600;color:var(--mut);margin:12px 0 6px}
.nom{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:14px;padding:6px 14px}
.nom span{font-weight:700;color:var(--mut);font-size:20px}
.nom input{border:0;background:none;font:inherit;font-size:26px;font-weight:800;width:100%;color:var(--tx);padding:6px 0;outline:0}
.nom:focus-within{border-color:var(--pri2)}
.cats{display:flex;flex-wrap:wrap;gap:8px}
.cats button{padding:9px 12px;border-radius:12px;background:var(--chip);font-size:13.5px;font-weight:600}
.cats button.on{background:var(--pri);color:#fff}
.in2{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;font:inherit;background:none;color:var(--tx)}
.btn{width:100%;background:var(--pri);color:#fff;font-weight:700;border-radius:16px;padding:15px;margin-top:18px;font-size:16px}
.err{color:var(--out);font-size:13px;margin-top:8px;min-height:18px}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:13.5px;z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.chips.w{flex-wrap:wrap}
.info{background:var(--inbg);border-radius:16px;padding:12px 14px;font-size:13.5px;margin-bottom:12px}.info b{display:block;margin-bottom:2px}
.rw{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:10px;background:var(--chip);border-radius:14px;margin-bottom:8px}
.rw .in2{background:var(--card);padding:10px 12px}.rw .rx{justify-self:end;align-self:center}
.res{background:var(--chip);border-radius:16px;padding:6px 14px;margin-top:14px}
.res div{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px}.res div:last-child{border-bottom:0}.res .hl b{font-size:18px;color:var(--pri2)}
.pcard{padding:14px;margin-bottom:10px}.ph{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}.ph span{color:var(--mut);font-size:12.5px}
.pg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.pg span{display:block;color:var(--mut);font-size:11.5px}.pg b{font-size:14px}
.pf{display:flex;gap:4px;margin-top:8px;border-top:1px solid var(--line)}.pf .link{margin-top:6px;padding:6px 10px}
.lr{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line)}.lr:last-child{border-bottom:0}.lr.k{font-weight:800}
</style>
</head>
<body>
<div class="app">
  <div class="top"><div class="logo">K</div><div><h1>KasKu</h1><p>Catatan kas usaha Anda</p></div></div>
  <div id="v"></div>
</div>

<nav><div>
  <button class="tab" data-v="home"><span>🏠</span>Beranda</button>
  <button class="tab" data-v="hist"><span>🧾</span>Riwayat</button>
  <button class="fab" id="add" aria-label="Tambah catatan">+</button>
  <button class="tab" data-v="rep"><span>📊</span>Laporan</button>
  <button class="tab" data-v="hpp"><span>🧮</span>HPP</button>
</div></nav>

<div class="ov" id="ov"><div class="sheet" id="sh">
  <h3>Catat transaksi</h3>
  <div class="seg"><button data-t="in" class="in">Pemasukan</button><button data-t="out" class="out">Pengeluaran</button></div>
  <div id="pbox" style="display:none"><label for="psel">Produk terjual (opsional)</label><select class="in2" id="psel"></select><label for="pqty">Jumlah terjual</label><input class="in2" id="pqty" inputmode="numeric" placeholder="Misal: 5"></div>
  <label for="nom">Jumlah</label>
  <div class="nom"><span>Rp</span><input id="nom" inputmode="numeric" placeholder="0" autocomplete="off"></div>
  <label>Kategori</label><div class="cats" id="cats"></div>
  <label for="dt">Tanggal</label><input class="in2" type="date" id="dt">
  <label for="nt">Catatan (opsional)</label><input class="in2" id="nt" maxlength="60" placeholder="Misal: 20 porsi nasi box">
  <div class="err" id="err"></div>
  <button class="btn" id="save">Simpan</button>
  <button class="link" id="cancel" style="width:100%">Batal</button>
</div></div>
<div class="ov" id="ov2"><div class="sheet">
  <h3>Hitung HPP produk</h3>
  <label for="pn">Nama produk</label><input class="in2" id="pn" maxlength="40" placeholder="Misal: Nasi box ayam bakar">
  <label for="pq">Jumlah yang dihasilkan (porsi/unit)</label><input class="in2" id="pq" inputmode="numeric" placeholder="Misal: 20">
  <label>Rincian biaya produksi</label><div id="rows"></div>
  <button class="link" id="addrow">+ Tambah biaya</button>
  <label for="pm">Target untung (%)</label><input class="in2" id="pm" inputmode="numeric" value="30">
  <label for="ps">Harga jual per unit (opsional)</label><div class="nom"><span>Rp</span><input id="ps" inputmode="numeric" placeholder="0"></div>
  <div class="res" id="res"></div>
  <div class="err" id="err2"></div>
  <button class="btn" id="psave">Simpan produk</button>
  <button class="link" id="pcancel" style="width:100%">Batal</button>
</div></div>
<div class="toast" id="toast"></div>

<script>
(function(){
var $=function(s){return document.querySelector(s)};
var KEY='kasku:v1',tx=[],view='home',mon=ym(new Date()),type='out',cat='',flt='all',arm=null;
var CATS={in:[['Penjualan','🛒'],['Jasa','🛠️'],['Lainnya','💰']],out:[['Bahan Baku','📦'],['Gaji','👥'],['Sewa','🏠'],['Listrik & Air','💡'],['Transport','🛵'],['Lainnya','🧾']]};
function ym(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
function today(){var d=new Date();return ym(d)+'-'+String(d.getDate()).padStart(2,'0')}
function rp(n){return 'Rp'+new Intl.NumberFormat('id-ID').format(Math.round(n))}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function ic(t,c){var a=CATS[t].filter(function(x){return x[0]===c})[0];return a?a[1]:'🧾'}
function load(){try{tx=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){tx=[]}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(tx))}catch(e){}}
function sum(l,t){return l.filter(function(x){return x.type===t}).reduce(function(a,b){return a+b.amount},0)}
function inMon(m){return tx.filter(function(x){return x.date.slice(0,7)===m})}
function monLabel(m){var p=m.split('-');return new Date(p[0],p[1]-1,1).toLocaleDateString('id-ID',{month:'long',year:'numeric'})}
function dayLabel(s){var p=s.split('-');var d=new Date(p[0],p[1]-1,p[2]);if(s===today())return 'Hari ini';return d.toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long'})}
function shift(n){var p=mon.split('-');mon=ym(new Date(p[0],p[1]-1+n,1));render()}
function sorted(l){return l.slice().sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:b.id-a.id})}
function item(x){var armed=arm===x.id;
 return '<div class="item"><div class="ic '+x.type+'">'+ic(x.type,x.cat)+'</div><div class="m"><b>'+esc(x.cat)+'</b><span>'+(esc(x.note)||dayLabel(x.date))+'</span></div><div class="amt '+x.type+'">'+(x.type==='in'?'+':'−')+rp(x.amount)+'</div><button class="del'+(armed?' arm':'')+'" data-del="'+x.id+'" aria-label="Hapus">'+(armed?'Hapus?':'✕')+'</button></div>'}
function empty(){return '<div class="empty"><div class="e">📒</div><b>Belum ada catatan</b>Tekan tombol + untuk mencatat pemasukan atau pengeluaran pertama Anda.<br><button class="link" data-demo>Coba dengan data contoh</button></div>'}
function monNav(){return '<div class="mon"><button data-m="-1" aria-label="Bulan sebelumnya">‹</button><b>'+monLabel(mon)+'</b><button data-m="1" aria-label="Bulan berikutnya">›</button></div>'}

function home(){
 var cm=ym(new Date()),l=inMon(cm),i=sum(l,'in'),o=sum(l,'out'),saldo=sum(tx,'in')-sum(tx,'out'),pct=i+o?Math.round(i/(i+o)*100):50;
 var r=sorted(tx).slice(0,6);
 return '<div class="hero"><small>Saldo kas saat ini</small><div class="big">'+rp(saldo)+'</div><div class="split"><i style="width:'+pct+'%"></i></div><div class="row"><div><span>Masuk bulan ini</span><b>'+rp(i)+'</b></div><div><span>Keluar bulan ini</span><b>'+rp(o)+'</b></div></div></div>'
 +'<h2>Transaksi terbaru</h2>'+(r.length?'<div class="card">'+r.map(item).join('')+'</div>':'<div class="card">'+empty()+'</div>')}

function hist(){
 var l=sorted(inMon(mon)).filter(function(x){return flt==='all'||x.type===flt}),h='',last='';
 l.forEach(function(x){if(x.date!==last){h+='</div>'+(last?'':'')+'<div class="day">'+dayLabel(x.date)+'</div><div class="card">';last=x.date}h+=item(x)});
 if(l.length)h=h.slice(6)+'</div>';
 return monNav()+'<div class="chips">'+[['all','Semua'],['in','Pemasukan'],['out','Pengeluaran']].map(function(c){return '<button class="chip'+(flt===c[0]?' on':'')+'" data-f="'+c[0]+'">'+c[1]+'</button>'}).join('')+'</div>'
 +(l.length?h:'<div class="card"><div class="empty"><div class="e">🗓️</div><b>Tidak ada catatan</b>Belum ada transaksi di bulan ini.</div></div>')}

function brk(l,t,color){
 var tot=sum(l,t),m={};l.filter(function(x){return x.type===t}).forEach(function(x){m[x.cat]=(m[x.cat]||0)+x.amount});
 var k=Object.keys(m).sort(function(a,b){return m[b]-m[a]});
 if(!k.length)return '<div class="empty">Belum ada data.</div>';
 return k.map(function(c){var p=Math.round(m[c]/tot*100);return '<div class="bar"><div class="ic '+t+'">'+ic(t,c)+'</div><div class="t"><div><span>'+esc(c)+'</span><span>'+rp(m[c])+' <em>'+p+'%</em></span></div><div class="track"><i style="width:'+p+'%;background:'+color+'"></i></div></div></div>'}).join('')}
function rep(){
 var l=inMon(mon),i=sum(l,'in'),o=sum(l,'out'),n=i-o;
 return monNav()+'<div class="sum"><div><span>Pemasukan</span><b style="color:var(--in)">'+rp(i)+'</b></div><div><span>Pengeluaran</span><b style="color:var(--out)">'+rp(o)+'</b></div><div class="w"><span>'+(n>=0?'Laba bulan ini':'Rugi bulan ini')+'</span><b style="color:'+(n>=0?'var(--in)':'var(--out)')+'">'+rp(Math.abs(n))+'</b></div></div>'
 +labaKotor(l,i,o)+'<h2>Sumber pemasukan</h2><div class="card">'+brk(l,'in','var(--in)')+'</div><h2>Ke mana uang keluar</h2><div class="card">'+brk(l,'out','var(--out)')+'</div>'}

function render(){
 $('#v').innerHTML=view==='home'?home():view==='hist'?hist():view==='hpp'?hppView():rep();
 document.querySelectorAll('.tab').forEach(function(b){b.classList.toggle('on',b.dataset.v===view)})}

function drawCats(){drawP();$('#cats').innerHTML=CATS[type].map(function(c){return '<button data-c="'+c[0]+'" class="'+(cat===c[0]?'on':'')+'">'+c[1]+' '+c[0]+'</button>'}).join('');
 document.querySelectorAll('.seg button').forEach(function(b){b.classList.toggle('on',b.dataset.t===type)})}
function openSheet(){type='out';cat='';$('#nom').value='';$('#nt').value='';$('#dt').value=today();$('#err').textContent='';$('#psel').value='';$('#pqty').value='';drawCats();$('#ov').classList.add('show');setTimeout(function(){$('#nom').focus()},250)}
function closeSheet(){$('#ov').classList.remove('show')}
function toast(t){var e=$('#toast');e.textContent=t;e.classList.add('show');setTimeout(function(){e.classList.remove('show')},1800)}

$('#nom').addEventListener('input',function(){var d=this.value.replace(/\D/g,'').slice(0,12);this.value=d?new Intl.NumberFormat('id-ID').format(+d):''});
$('#add').onclick=openSheet;$('#cancel').onclick=closeSheet;
$('#ov').addEventListener('click',function(e){if(e.target===this)closeSheet()});
$('#save').onclick=function(){
 var a=+($('#nom').value.replace(/\D/g,'')||0),d=$('#dt').value;
 if(!a){$('#err').textContent='Isi jumlah uang terlebih dahulu.';return}
 if(!cat){$('#err').textContent='Pilih salah satu kategori.';return}
 if(!d){$('#err').textContent='Pilih tanggal transaksi.';return}
 var t={id:Date.now(),type:type,amount:a,cat:cat,date:d,note:$('#nt').value.trim()},pid=type==='in'?+$('#psel').value:0,pp=prods.filter(function(x){return x.id===pid})[0];if(pp){var qq=num($('#pqty').value)||1;t.hpp=calcP(pp.rows,pp.qty,pp.margin,0).h*qq;t.pid=pid;t.q=qq}tx.push(t);save();
 mon=d.slice(0,7);closeSheet();render();toast('Catatan disimpan')};
document.addEventListener('click',function(e){
 var t=e.target.closest('button');if(!t)return;
 if(t.dataset.v){view=t.dataset.v;arm=null;if(view!=='home')mon=mon;render();window.scrollTo(0,0)}
 else if(t.dataset.t){type=t.dataset.t;cat='';drawCats()}
 else if(t.dataset.c){cat=t.dataset.c;drawCats()}
 else if(t.dataset.f){flt=t.dataset.f;render()}
 else if(t.dataset.m){shift(+t.dataset.m)}
 else if(t.dataset.del){var id=+t.dataset.del;if(arm===id){tx=tx.filter(function(x){return x.id!==id});save();arm=null;toast('Catatan dihapus')}else arm=id;render()}
 else if(t.hasAttribute('data-demo')){demo()}
 else if(t.dataset.hc){var k=hc.indexOf(t.dataset.hc);if(k>-1)hc.splice(k,1);else hc.push(t.dataset.hc);saveH();render()}
 else if(t.hasAttribute('data-newp')){openP()}
